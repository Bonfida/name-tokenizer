[package]
name = "name-tokenizer"
version = "2.0.0"
edition = "2018"
description = "A Solana program which enables the tokenization of a Solana Name Service into an NFT"
license = "MIT"
repository = "https://github.com/bonfida/name-tokenizer"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
no-entrypoint = []
test-bpf = []
devnet = []


[dependencies]
solana-program = "2.2.1"
num_enum = "0.5.4"
borsh = "0.10.3"
thiserror = "1.0.44"
num-traits = "0.2"
num-derive = "0.3"
enumflags2 = "0.7.1"
spl-token = { version = "7.0.0", features = ["no-entrypoint"] }
bonfida-utils = "0.7.0"
spl-associated-token-account = { version = "7.0.0", features = [
    "no-entrypoint",
] }
spl-name-service = { version = "0.4.0", package = "spl-name-service-2", features = [
    "no-entrypoint",
] }
mpl-token-metadata = { version = "5.1.1" }
solana-security-txt = "1.1.1"


[dev-dependencies]
hexdump = "0.1.0"
solana-sdk = "2.2.1"
rand = "0.8.4"
arrayref = "0.3.6"
solana-program-test = "2.2.1"
tokio = { version = "1.6", features = ["macros"] }


[lib]
crate-type = ["cdylib", "lib"]
